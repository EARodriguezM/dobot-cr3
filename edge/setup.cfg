# Python style for the edge services, matching ament_flake8 (the convention
# the ROS 2 packages in this project already follow): single quotes, 99-column
# lines. Recorded here so editors and CI agree instead of each applying their
# own defaults.
[flake8]
max-line-length = 99
# D1xx: ament does not require a docstring on every symbol, and neither do we —
# the modules and non-obvious functions carry them, trivial accessors do not.
extend-ignore = D100,D101,D102,D103,D104,D105,D107,W503,W504
exclude = .venv,__pycache__,build,install,log
inline-quotes = single
multiline-quotes = single
docstring-quotes = double
